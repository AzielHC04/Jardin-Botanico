<div class="admin-login-page">

  <section class="login-card">


    <!-- ====================================================
         IDENTIDAD
         ==================================================== -->

    <div class="login-brand">

      <span class="eyebrow">
        ADMINISTRACIÓN
      </span>

      <h1>
        Jardín Botánico de Teya
      </h1>

      <p>
        Acceso al panel de gestión
        del sitio.
      </p>

    </div>


    <!-- ====================================================
         FORMULARIO
         ==================================================== -->

    <form
      [formGroup]="formulario"
      (ngSubmit)="iniciarSesion()"
      class="login-form"
    >


      <!-- CORREO -->

      <div class="campo">

        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="administrador@teya.com"
        >

        <small
          class="error-campo"
          *ngIf="
            campoInvalido('email')
          "
        >
          Ingresa un correo válido.
        </small>

      </div>


      <!-- CONTRASEÑA -->

      <div class="campo">

        <label for="password">
          Contraseña
        </label>


        <div class="password-wrapper">

          <input
            id="password"
            [type]="
              mostrarPassword
                ? 'text'
                : 'password'
            "
            formControlName="password"
            autocomplete="current-password"
            placeholder="Contraseña"
          >


          <button
            type="button"
            class="mostrar-password"
            (click)="alternarPassword()"
          >
            {{
              mostrarPassword
                ? 'Ocultar'
                : 'Mostrar'
            }}
          </button>

        </div>


        <small
          class="error-campo"
          *ngIf="
            campoInvalido(
              'password'
            )
          "
        >
          Ingresa tu contraseña.
        </small>

      </div>


      <!-- ERROR -->

      <div
        class="login-error"
        *ngIf="errorLogin"
      >
        {{ errorLogin }}
      </div>


      <!-- ENTRAR -->

      <button
        type="submit"
        class="btn-login"
        [disabled]="enviando"
      >
        {{
          enviando
            ? 'Ingresando...'
            : 'Ingresar al panel'
        }}
      </button>

    </form>


    <div class="login-footer">

      <p>
        Acceso exclusivo para
        personal autorizado.
      </p>

    </div>

  </section>

</div>
