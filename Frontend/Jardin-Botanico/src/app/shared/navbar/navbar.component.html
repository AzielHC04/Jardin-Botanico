<header class="site-header">

  <div class="navbar">


    <!-- ====================================================
         IDENTIDAD
         ==================================================== -->

    <a
      routerLink="/home"
      class="brand"
      (click)="cerrarMenu()"
    >

      <strong>
        Hacienda Teya
      </strong>

      <span>
        JARDÍN BOTÁNICO & EVENTOS
      </span>

    </a>


    <!-- ====================================================
         BOTÓN MENÚ MÓVIL
         ==================================================== -->

    <button
      type="button"
      class="menu-toggle"
      aria-label="Abrir menú"
      [class.active]="menuAbierto"
      (click)="alternarMenu()"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>


    <!-- ====================================================
         NAVEGACIÓN
         ==================================================== -->

    <nav
      class="nav-links"
      [class.open]="menuAbierto"
    >


      <a
        routerLink="/home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: true
        }"
        (click)="cerrarMenu()"
      >
        Inicio
      </a>


      <a
        routerLink="/experiencias"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        Experiencias
      </a>


      <a
        routerLink="/eventos"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        Eventos
      </a>


      <a
        routerLink="/jardin"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        Jardín Botánico
      </a>


      <a
        routerLink="/contacto"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        Contacto
      </a>


      <!-- ==================================================
           ACCESO A CUENTA
           ================================================== -->

      <a
        *ngIf="!sesionActiva"
        routerLink="/admin/login"
        class="account-button"
        (click)="cerrarMenu()"
      >

        <span class="account-icon login-icon">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M20 21a8 8 0 0 0-16 0"
            />

            <circle
              cx="12"
              cy="7"
              r="4"
            />
          </svg>

        </span>


        <span class="account-text">

          <strong>
            Iniciar sesión
          </strong>

          <small>
            Administración
          </small>

        </span>

      </a>


      <!-- USUARIO CON SESIÓN -->

      <a
        *ngIf="sesionActiva"
        routerLink="/admin"
        class="account-button logged"
        (click)="cerrarMenu()"
      >

        <span class="account-avatar">
          {{ inicialUsuario }}
        </span>


        <span class="account-text">

          <strong>
            Mi perfil
          </strong>

          <small>
            Panel administrativo
          </small>

        </span>

      </a>

    </nav>

  </div>

</header>
