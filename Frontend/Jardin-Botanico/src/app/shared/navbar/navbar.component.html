<header class="site-header">

  <div class="navbar">


    <!-- ====================================================
         IDENTIDAD
         ==================================================== -->

    <a
      routerLink="/home"
      class="brand"
      (click)="cerrarMenu()"
    >

      <strong>
        Hacienda Teya
      </strong>

      <span>
        JARDÍN BOTÁNICO & EVENTOS
      </span>

    </a>


    <!-- ====================================================
         MENÚ MÓVIL
         ==================================================== -->

    <button
      type="button"
      class="menu-toggle"
      aria-label="Abrir menú"
      [class.active]="menuAbierto"
      (click)="alternarMenu()"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>


    <!-- ====================================================
         NAVEGACIÓN
         ==================================================== -->

    <nav
      class="nav-links"
      [class.open]="menuAbierto"
    >


      <a
        routerLink="/home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: true
        }"
        (click)="cerrarMenu()"
      >
        Inicio
      </a>


      <a
        routerLink="/experiencias"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        Experiencias
      </a>


      <a
        routerLink="/eventos"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        Eventos
      </a>


      <a
        routerLink="/jardin"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        Jardín Botánico
      </a>


      <a
        routerLink="/contacto"
        routerLinkActive="active"
        (click)="cerrarMenu()"
      >
        Contacto
      </a>


      <!-- CTA -->

      <a
        routerLink="/contacto"
        class="nav-cta"
        (click)="cerrarMenu()"
      >
        Solicitar información
        <span>→</span>
      </a>

    </nav>

  </div>

</header>
