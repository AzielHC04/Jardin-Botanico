<article
  class="evento-card"
  [class.evento-especial]="esEspecial"
>


  <!-- ======================================================
       IMAGEN
       ====================================================== -->

  <div class="evento-imagen">

    <img
      [src]="evento.imagen"
      [alt]="evento.titulo"
      loading="lazy"
    >


    <span
      class="evento-etiqueta"
      *ngIf="evento.etiqueta"
    >
      {{ evento.etiqueta }}
    </span>


    <span
      class="evento-cupo"
      *ngIf="
        evento.cupoTotal !== null
        && evento.cupoTotal !== undefined
      "
    >
      Cupo máximo:
      {{ evento.cupoTotal }}
    </span>

  </div>


  <!-- ======================================================
       CONTENIDO
       ====================================================== -->

  <div class="evento-contenido">


    <!-- FECHA -->

    <div
      class="evento-fecha"
      *ngIf="evento.fecha"
    >

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect
          width="18"
          height="18"
          x="3"
          y="4"
          rx="2"
          ry="2"
        />

        <line
          x1="16"
          x2="16"
          y1="2"
          y2="6"
        />

        <line
          x1="8"
          x2="8"
          y1="2"
          y2="6"
        />

        <line
          x1="3"
          x2="21"
          y1="10"
          y2="10"
        />
      </svg>

      <span>
        {{ evento.fecha }}
      </span>

    </div>


    <!-- TÍTULO -->

    <h3>
      {{ evento.titulo }}
    </h3>


    <!-- DESCRIPCIÓN -->

    <p class="evento-descripcion">
      {{ evento.descripcion }}
    </p>


    <!-- METADATOS -->

    <div class="evento-meta">

      <span class="evento-horario">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle
            cx="12"
            cy="12"
            r="10"
          />

          <polyline
            points="12 6 12 12 16 14"
          />
        </svg>

        {{ evento.horario }}

      </span>


      <span class="evento-precio">
        {{ evento.precio }}
      </span>

    </div>


    <!-- BOTÓN -->

    <a
      class="evento-boton"
      [routerLink]="[
        '/reserva',
        evento.id
      ]"
    >
      {{
        evento.textoBoton
        || 'Ver información'
      }}
    </a>

  </div>

</article>
